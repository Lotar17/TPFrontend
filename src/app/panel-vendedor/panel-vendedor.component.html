<div class="flex min-h-screen bg-gradient-to-r from-indigo-100 via-indigo-200 to-indigo-300">
  
  <!-- Sidebar -->
  <div class="w-64 bg-gradient-to-b from-indigo-600 to-indigo-800 text-white p-6 shadow-lg">
    <h2 class="text-2xl font-bold text-center mb-6">Panel de Vendedor</h2>
    
    <ul class="space-y-4">
      <li>
        <a  class="block px-4 py-2 bg-indigo-700 rounded-lg hover:bg-indigo-500 transition" routerLink="/vendedor">📦 Mis Productos</a>
      </li>
      <li>
        <a  class="block px-4 py-2 bg-indigo-700 rounded-lg hover:bg-indigo-500 transition"routerLink="/devolucionVendedor">📋 Mis Solicitudes</a>
      </li>
      <li>
        <a  class="block px-4 py-2 bg-indigo-700 rounded-lg hover:bg-indigo-500 transition"routerLink="/publicaprod">➕ Cargar Producto</a>
      </li>
    </ul>
  </div>

  <!-- Contenido principal -->
  <div class="flex-1 container mx-auto p-6">
    <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">Productos Publicados</h2>

    <div *ngIf="productos; else noProductos">
      <table class="w-full border-collapse border border-gray-300 rounded-lg shadow-md">
        <thead>
          <tr class="bg-gradient-to-r from-indigo-300 via-indigo-400 to-indigo-500 text-white">
            <th class="border border-gray-300 px-4 py-2">Nombre</th>
            <th class="border border-gray-300 px-4 py-2">Precio</th>
            <th class="border border-gray-300 px-4 py-2">Stock</th>
            <th class="border border-gray-300 px-4 py-2">Acciones</th> 
            <th class="border border-gray-300 px-4 py-2">Borrar Producto</th> <!-- Nueva columna para los botones -->
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producto of productos" class="border border-gray-300 bg-white hover:bg-indigo-50">
            <td class="border border-gray-300 px-4 py-2">{{ producto.descripcion }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ producto.precio | currency }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ producto.stock }}</td>
            <td class="border border-gray-300 px-4 py-2 text-center">
              <!-- Botón para modificar el producto -->
              <button 
              (click)="modificarProducto(producto)" 
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded transition duration-300"
            >
              ✏️ Modificar
            </button>
            </td>
            <td class="border border-gray-300 px-4 py-2 text-center">
              <!-- Botón para modificar el producto -->
              <button 
              (click)="borrarProducto(producto)" 
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded transition duration-300"
            >
               Borrar Producto
            </button>
            </td>
          </tr>
        </tbody>
      </table>
      
    </div>

    <ng-template #noProductos>
      <p class="text-center text-gray-600">No tienes productos publicados.</p>
    </ng-template>
  </div>

</div>
