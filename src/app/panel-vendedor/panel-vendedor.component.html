<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Productos Publicados</h2>
  
    <div *ngIf="productos; else noProductos">
      <table class="w-full border-collapse border border-gray-300">
        <thead>
          <tr class="bg-gray-200">
            <th class="border border-gray-300 px-4 py-2">Nombre</th>
            <th class="border border-gray-300 px-4 py-2">Precio</th>
            <th class="border border-gray-300 px-4 py-2">Stock</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producto of productos" class="border border-gray-300">
            <td class="border border-gray-300 px-4 py-2">{{ producto.descripcion }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ producto.precio | currency }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ producto.stock }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <ng-template #noProductos>
      <p class="text-gray-500">No tienes productos publicados.</p>
    </ng-template>
  </div>
