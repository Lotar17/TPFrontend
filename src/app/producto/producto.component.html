<div class="min-h-screen bg-gradient-to-tr from-gray-100 via-white to-gray-200">

<div class="min-h-screen bg-gray-100 p-6">
  <div class="w-full max-w-7xl mx-auto">
    <!-- Header -->
    <app-header class="block mb-8"></app-header>

    <div class="flex flex-col md:flex-row gap-6">
      <!-- Sidebar -->
      <!-- ProductosComponent template (productos.component.html) -->
<app-sidebar *ngIf="idUser" [personaId]="idUser"></app-sidebar>


      <div class="flex-1 bg-white shadow-lg rounded-3xl p-6 sm:p-8 lg:p-10 border border-gray-100 transition-all duration-300">
        <!-- Barra de búsqueda -->
        <app-search-bar
          (searchEvent)="updateSearchTerm($event)"
          class="mb-8 w-full"
        ></app-search-bar>
      
        <!-- Título -->
        <h2 class="text-2xl font-bold text-gray-900 mb-6 tracking-tight">
          Productos Disponibles
        </h2>
      
        <!-- Lista de productos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 lg:gap-8">
          <app-product-card
            *ngFor="let producto of productos"
            [producto]="producto"
            class="transition-transform duration-300 hover:scale-[1.03] hover:shadow-md rounded-lg"
          ></app-product-card>
        </div>
      
        <!-- Si no hay productos -->
        <div *ngIf="productos.length === 0" class="text-center mt-12 py-10 bg-gray-50 rounded-xl">
          <p class="text-lg font-medium text-gray-600">No se encontraron productos</p>
          <p class="text-sm text-gray-400 mt-2">Prueba con otros términos de búsqueda o agrega nuevos productos.</p>
        </div>
      </div>
    </div>
  </div>
</div>
