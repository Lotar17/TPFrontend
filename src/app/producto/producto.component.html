<div class="min-h-screen bg-gradient-to-br from-blue-600 via-indigo-500 to-purple-600 p-6">
  <div class="w-full max-w-7xl mx-auto">
    <app-header class="block mb-8"></app-header>
    <div class="flex flex-col md:flex-row gap-6">
      <!-- Barra Lateral -->
      <div class="w-full md:w-64 bg-gray-900 text-white p-6 rounded-lg shadow-lg flex-shrink-0">
        <ul class="flex flex-col space-y-3">
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              routerLink="/publicaprod"
            >
              Cargar Producto
            </a>
          </li>
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              routerLink="/compras"
            >
              Ver mis compras
            </a>
          </li>
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              (click)="verCarrito()"
            >
              Ver Carrito
            </a>
          </li>
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              routerLink="/vendedor"
            >
              Mis Publicaciones
            </a>
          </li>
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              routerLink="/devolucionComprador"
            >
              Mis Devoluciones
            </a>
          </li>
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              routerLink="/panelSeguimientoCliente"
            >
              Ver seguimientos
            </a>
          </li>
          <li>
            <a
              class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
              routerLink="/panelSeguimientoEmpleado"
            >
              Ver Panel empleado
            </a>
          </li>
        </ul>
      </div>

      <!-- Contenido Principal -->
      <div class="flex-1 bg-white shadow-2xl rounded-2xl p-6">
        <app-search-bar
          (searchEvent)="updateSearchTerm($event)"
          class="mb-8 w-full"
        ></app-search-bar>
        <div class="productos-list grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <app-product-card
            *ngFor="let producto of productos"
            [producto]="producto"
            class="transition-all duration-300"
          ></app-product-card>
        </div>
      </div>
    </div>
  </div>
</div>
