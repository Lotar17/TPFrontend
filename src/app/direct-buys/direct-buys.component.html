<div *ngIf="producto" class="max-w-lg mx-auto bg-white shadow-lg rounded-xl p-6 border border-gray-200 mt-10">
  
  <!-- Nombre del Producto -->
  <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ producto.descripcion }}</h2>

  <!-- Precio -->
  <p class="text-xl font-semibold text-green-600">{{ producto.precio | currency }}</p>

  <!-- Formulario de compra -->
  <form [formGroup]="publicaForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">

    <div class="flex flex-col space-y-3">
      <!-- Dirección de Entrega -->
      <label for="direccion_entrega" class="text-gray-700 font-semibold">📍 Dirección de Entrega</label>
      <input id="direccion_entrega" formControlName="direccion_entrega" type="text"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

      <!-- Cantidad de Producto -->
      <label for="cantidad_producto" class="text-gray-700 font-semibold">🔢 Cantidad</label>
      <input id="cantidad_producto" formControlName="cantidad_producto" type="number" min="1"
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Botón de Compra -->
    <button type="submit"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-105">
      🛒 Comprar
    </button>
  </form>
</div>

<!-- Mensaje de carga -->
<p *ngIf="!producto" class="text-center text-red-500 font-semibold mt-6">⏳ Cargando producto...</p>
