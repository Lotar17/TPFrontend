<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-400 to-blue-500 p-6">
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-2xl p-6">

    <!-- Mostrar producto -->
    <div *ngIf="producto" class="max-w-lg mx-auto bg-white shadow-lg rounded-xl p-6 border border-gray-200 mt-10">

      <!-- Nombre del Producto -->
      <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ producto.descripcion }}</h2>

      <!-- Precio -->
      <p class="text-xl font-semibold text-green-600">{{ producto.precio | currency }}</p>

      <!-- Formulario de compra -->
      <form [formGroup]="publicaForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">

        <!-- Dirección existente -->
        <div *ngIf="!mostrarNuevaDireccion">
          <label for="direccion" class="block text-gray-700 font-semibold mb-1">📍 Seleccioná una Dirección</label>
          <select id="direccion" formControlName="direccion"
            class="w-full p-3 border border-gray-300 rounded-lg shadow focus:ring-2 focus:ring-blue-400 focus:outline-none">
            <option *ngFor="let dir of direcciones" [value]="dir.id">
              {{ dir.calle }} {{ dir.numero }}
            </option>
          </select>

          <div class="text-center mt-2">
            <button type="button" (click)="mostrarNuevaDireccion = true"
              class="text-blue-600 hover:underline font-semibold">
              ¿Querés ingresar una nueva dirección?
            </button>
          </div>
        </div>

        <!-- Nueva dirección -->
        <div *ngIf="mostrarNuevaDireccion" class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-300">

          <div>
            <label class="block text-gray-700 font-semibold">Calle</label>
            <input type="text" formControlName="calle"
              class="w-full mt-1 p-3 border border-gray-300 rounded-lg shadow focus:ring-2 focus:ring-blue-400 focus:outline-none"
              required />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold">Número</label>
            <input type="number" formControlName="numero"
              class="w-full mt-1 p-3 border border-gray-300 rounded-lg shadow focus:ring-2 focus:ring-blue-400 focus:outline-none"
              required />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold">Localidad</label>
            <select formControlName="localidad"
              class="w-full p-3 border border-gray-300 rounded-lg shadow focus:ring-2 focus:ring-blue-400 focus:outline-none"
              required>
              <option *ngFor="let loc of localidades" [value]="loc.id">
                {{ loc.nombre }}
              </option>
            </select>
          </div>

          <div class="text-center">
            <button type="button" (click)="mostrarNuevaDireccion = false"
              class="text-red-600 hover:underline font-semibold">
              Cancelar nueva dirección
            </button>
          </div>
        </div>

        <!-- Cantidad -->
        <div>
          <label for="cantidad_producto" class="text-gray-700 font-semibold">🔢 Cantidad</label>
          <input id="cantidad_producto" formControlName="cantidad_producto" type="number" min="1" [max]="producto.stock ?? 1"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
            (input)="validarCantidad()" #cantidadInput>

          <!-- Mensaje de error si la cantidad es inválida -->
          <p *ngIf="cantidadInvalida" class="text-red-500 font-semibold mt-1">
            ❌ Cantidad no válida. Stock disponible: {{ producto.stock }}
          </p>
        </div>

        <!-- Botón de compra -->
        <button type="submit" [disabled]="cantidadInvalida"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
          🛒 Comprar
        </button>
      </form>
    </div>

    <!-- Mensaje visible -->
    <div *ngIf="mensajeVisible" class="notification mt-4 text-center text-green-700 font-semibold">
      {{ mensajeVisible }}
    </div>

    <!-- Mensaje de carga -->
    <p *ngIf="!producto" class="text-center text-red-500 font-semibold mt-6">⏳ Cargando producto...</p>

  </div>
</div>
