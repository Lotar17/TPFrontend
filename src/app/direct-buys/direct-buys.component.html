<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-400 to-blue-500 p-6">
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-2xl p-6">

<div *ngIf="producto" class="max-w-lg mx-auto bg-white shadow-lg rounded-xl p-6 border border-gray-200 mt-10">
  
  <!-- Nombre del Producto -->
  <h2 class="text-2xl font-bold text-gray-800 mb-2">{{ producto.descripcion }}</h2>

  <!-- Precio -->
  <p class="text-xl font-semibold text-green-600">{{ producto.precio | currency }}</p>

  <!-- Formulario de compra -->
 <!-- Formulario de compra -->
<form [formGroup]="publicaForm" (ngSubmit)="onSubmit()" class="mt-6 space-y-4">

  <div class="flex flex-col space-y-3">
    <!-- Dirección de Entrega -->
    <label for="direccion_entrega" class="text-gray-700 font-semibold">📍 Dirección de Entrega</label>
    <input id="direccion_entrega" formControlName="direccion_entrega" type="text"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

    <!-- Cantidad de Producto -->
    <label for="cantidad_producto" class="text-gray-700 font-semibold">🔢 Cantidad</label>
    <input id="cantidad_producto" formControlName="cantidad_producto" type="number" min="1" [max]="producto.stock ?? 1"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
      (input)="validarCantidad()" #cantidadInput>
    
    <!-- 🔴 Nuevo mensaje de error si la cantidad no es válida -->
    <p *ngIf="cantidadInvalida" class="text-red-500 font-semibold">❌ Cantidad no válida. Stock disponible: {{ producto.stock }}</p>
  </div>

  <!-- Botón de Compra (deshabilitado si la cantidad no es válida) -->
  <button type="submit" [disabled]="cantidadInvalida"
    class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition-all duration-300 transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed">
    🛒 Comprar
  </button>
</form>

</div>
<div *ngIf="mensajeVisible" class="notification mt-2">
  {{ mensajeVisible }}
</div>

<!-- Mensaje de carga -->
<p *ngIf="!producto" class="text-center text-red-500 font-semibold mt-6">⏳ Cargando producto...</p>
