<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-400 to-blue-500 p-6">
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-2xl p-6">
    
    <!-- Título -->
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">🛒 Tu Carrito</h2>

    <!-- Lista de productos -->
    <div *ngIf="items.length > 0; else emptyCarrito" class="space-y-4">
      <div *ngFor="let item of items" class="flex items-center justify-between p-4 bg-gray-100 rounded-lg shadow-md">
        
        <!-- Info del producto -->
        <div>
          <p class="text-lg font-semibold text-gray-700">📦 {{ item.producto?.descripcion }}</p>
          <p class="text-sm text-gray-600">Cantidad: <span class="font-bold">{{ item.cantidad_producto }}</span></p>
          <p class="text-sm text-gray-600">💰 Precio Unitario: <span class="font-bold text-green-600">${{ item.producto?.precio }}</span></p>
        </div>

        <!-- Botones de acción -->
        <div class="flex space-x-2">
          <button (click)="incrementarCantidad(item.producto?.id, item)" 
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-full transition-all duration-300">
            ➕
          </button>
          <button (click)="decrementarCantidad(item.producto?.id, item)" 
            class="bg-yellow-500 hover:bg-yellow-700 text-white font-bold py-2 px-3 rounded-full transition-all duration-300">
            ➖
          </button>
          <button (click)="eliminarItem(item.id)" 
            class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-3 rounded-full transition-all duration-300">
            🗑️
          </button>
        </div>

      </div>

      <!-- Subtotal -->
      <p class="text-xl font-bold text-gray-800 text-center mt-4">🛍️ Subtotal: <span class="text-green-600">${{ subtotal | number:'1.2-2' }}</span></p>

      <!-- Botón de compra -->
      <button (click)="realizarCompra(items)" 
        class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105">
        🛒 Finalizar Compra
      </button>
    </div>

    <!-- Carrito vacío -->
    <ng-template #emptyCarrito>
      <p class="text-lg text-center text-gray-700 font-semibold mt-6">🛑 No tienes productos en tu carrito.</p>
    </ng-template>

  </div>
</div>
