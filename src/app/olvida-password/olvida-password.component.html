<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-500 to-pink-500 p-6">
    <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl p-8">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800">¿Olvidaste tu contraseña?</h2>
        <p class="text-gray-500 mt-2">Ingresá tu correo electrónico para recuperar el acceso</p>
      </div>
  
      <form [formGroup]="olvidaForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="ejemplo@email.com"
            class="mt-1 w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
          />
        </div>
  
        <button
          type="submit"
          class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition duration-200"
        >
          Recibir Mail
        </button>
      </form>
  
      <p class="mt-6 text-center text-sm text-gray-600">
        ¿Ya tenés cuenta?
        <a routerLink="/login" class="text-indigo-600 hover:text-indigo-800 font-medium">Iniciar sesión</a>
      </p>
    </div>
  </div>
