<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-indigo-600 via-blue-400 to-white p-6">
  <div class="w-full max-w-md bg-white shadow-2xl rounded-2xl p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800">¿Olvidaste tu contraseña?</h2>
      <p class="text-gray-500 mt-2">Ingresá tu correo electrónico para recuperar el acceso</p>
    </div>
    <div *ngIf="cargando" class="flex justify-center mt-8">
      <svg class="animate-spin h-12 w-12 text-indigo-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
    </div>
    
    <!-- Mensaje de éxito -->
    <div
      *ngIf="correoEnviado"
      class="flex items-center p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-100"
      role="alert"
    >
      <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
        <path
          fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm-1-4.414l5.293-5.293-1.414-1.414L9 11.172 7.121 9.293 5.707 10.707 9 14z"
          clip-rule="evenodd"
        />
      </svg>
      {{ mensajeExito }}
    </div>

    <form [formGroup]="olvidaForm" (ngSubmit)="abrirModalCorreo()" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="mail"
          placeholder="ejemplo@email.com"
          class="mt-1 w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
        />
      </div>

      <button
      type="submit"
      [disabled]="olvidaForm.invalid"
      class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md 
             hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 
             focus:ring-offset-2 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Recibir Mail
    </button>
    
    </form>
    <div *ngIf="mensajeError" class="mt-4 text-center text-sm text-red-600">
      {{ mensajeError }}
    </div>
    

    <p class="mt-6 text-center text-sm text-gray-600">
      ¿Ya tenés cuenta?
      <a routerLink="/login" class="text-indigo-600 hover:text-indigo-800 font-medium">Iniciar sesión</a>
    </p>
  </div>

  <!-- Modal -->
  <div
    tabindex="-1"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
    [class.hidden]="!modalCorreo"
  >
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md text-center">
      <h3 class="text-lg font-medium text-gray-900 mb-4">
        ¿Enviar correo para restablecer contraseña?
      </h3>

      <button
        (click)="confirmaCorreo()"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mr-2"
      >
        Sí, enviar
      </button>
      <button
        (click)="cancelarCorreo()"
        class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400"
      >
        Cancelar
      </button>
    </div>
  </div>

  
 
</div>
