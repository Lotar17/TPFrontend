<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-400 to-blue-500 p-6">
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-2xl p-6">

<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-8 sm:p-10">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">📦 Publicar Producto</h2>

    <form [formGroup]="publicaForm" (submit)="onSubmit()" class="space-y-6">
      <!-- Descripción -->
      <div>
        <label for="descripcion" class="block text-gray-700 font-semibold mb-1">📝 Descripción</label>
        <input
          type="text"
          formControlName="descripcion"
          id="descripcion"
          placeholder="Ingrese la descripción del producto"
          class="w-full border border-gray-300 px-4 py-2 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>

      <!-- Categoría -->
      <div>
        <label for="categoria" class="block text-gray-700 font-semibold mb-1">📂 Categoría</label>
        <select
          id="categoria"
          name="categoria"
          autocomplete="categoria"
          formControlName="categoria"
          class="w-full border border-gray-300 px-4 py-2 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white"
        >
          @for (categoria of categorias$ | async; track categoria.id) {
            <option value="{{ categoria.id }}">{{ categoria.descripcion }}</option>
          }
        </select>
      </div>

      <!-- Precio -->
      <div>
        <label for="precio" class="block text-gray-700 font-semibold mb-1">💲 Precio</label>
        <input
          type="number"
          formControlName="precio"
          id="precio"
          [min]="1"
          placeholder="Ingrese el precio del producto"
          class="w-full border border-gray-300 px-4 py-2 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>

      <!-- Stock -->
      <div>
        <label for="stock" class="block text-gray-700 font-semibold mb-1">📦 Stock</label>
        <input
          type="number"
          formControlName="stock"
          [min]="1"
          id="stock"
          placeholder="Cantidad en stock"
          class="w-full border border-gray-300 px-4 py-2 rounded-lg shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>

      <!-- Botón de enviar -->
      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-300 transform hover:scale-105"
      >
        🚀 Publicar Producto
      </button>
    </form>
    <div *ngIf="mensajeVisible" class="notification mt-2">
      {{ mensajeVisible }}
    </div>
  </div>
</div>
