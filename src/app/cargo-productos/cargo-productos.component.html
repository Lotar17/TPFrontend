<app-header></app-header>
<div class="min-h-screen bg-gradient-to-br from-blue-600 via-indigo-500 to-purple-600 p-6 flex items-center justify-center">
  <app-sidebar  *ngIf="userId" [personaId]="userId"></app-sidebar>
  <div class="w-full max-w-lg bg-white shadow-2xl rounded-2xl p-8 sm:p-10">
  
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">📦 Publicar Producto</h2>

    <form [formGroup]="publicaForm" (ngSubmit)="abrirModalCarga()" class="space-y-6">

      <!-- Descripción -->
      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">📝 Descripción</label>
        <input
          type="text"
          formControlName="descripcion"
          id="descripcion"
          placeholder="Ingrese la descripción del producto"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
        />
        <div *ngIf="publicaForm.get('descripcion')?.touched && publicaForm.get('descripcion')?.invalid" class="text-red-500 text-sm">
          La descripción es obligatoria.
        </div>
      </div>

      <!-- Categoría -->
      <div>
        <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">📂 Categoría</label>
        <select
          id="categoria"
          name="categoria"
          autocomplete="categoria"
          formControlName="categoria"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
        >
          @for (categoria of categorias$ | async; track categoria.id) {
            <option value="{{ categoria.id }}">{{ categoria.descripcion }}</option>
          }
        </select>
        <div *ngIf="publicaForm.get('categoria')?.touched && publicaForm.get('categoria')?.invalid" class="text-red-500 text-sm">
          La categoria es obligatoria.
        </div>
      </div>

      <!-- Precio -->
      <div>
        <label for="precio" class="block text-sm font-medium text-gray-700 mb-1">💲 Precio</label>
        <input
          type="number"
          formControlName="precio"
          id="precio"
          [min]="1"
          placeholder="Ingrese el precio del producto"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
        
        />
        <div *ngIf="publicaForm.get('precio')?.touched && publicaForm.get('precio')?.invalid" class="text-red-500 text-sm">
          El precio es obligatorio.
        </div>
      </div>
      
      <!-- Stock -->
      <div>
        <label for="stock" class="block text-sm font-medium text-gray-700 mb-1">📦 Stock</label>
        <input
          type="number"
          formControlName="stock"
          [min]="1"
          id="stock"
          placeholder="Cantidad en stock"
          class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-700 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition duration-200"
         
        />
        <div *ngIf="publicaForm.get('stock')?.touched && publicaForm.get('stock')?.invalid" class="text-red-500 text-sm">
          El stock es obligatorio
        </div>
      </div>
      

      <!-- Botón de enviar -->
      <button
      type="submit"
      class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition duration-200"
      [disabled]="publicaForm.invalid"
    >
      🚀 Publicar Producto
    </button>
    
    
    </form>
    <div *ngIf="mensajeVisible" class="mt-4 text-center text-sm text-gray-600">
      {{ mensajeVisible }}
    </div>
    <!-- Spinner grande visible -->
<div *ngIf="spinnerVisible" class="flex justify-center mt-8">
  <svg class="animate-spin h-12 w-12 text-indigo-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
  </svg>
</div>

  </div>
  <!-- Modal de Confirmación de Carga de Producto -->
<div 
*ngIf="muestraModalProducto" 
class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50"
>
<div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">¿Confirmar carga de producto?</h3>
  <p class="text-sm text-gray-600 mb-6">Esta acción agregará el producto al sistema.</p>

  <div class="flex justify-end space-x-4">
    <button
      (click)="cancelarCarga()"
      class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400 transition"
    >
      Cancelar
    </button>
    <button
      (click)="realizaCargaProducto()"
      class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition"
    >
      Confirmar
    </button>
  </div>
</div>
</div>
<div *ngIf="mensajeVisible" class="mt-4 text-center text-sm text-gray-600">
  {{ mensajeVisible }}
  <div *ngIf="spinnerVisible" class="flex justify-center mt-4">
    <svg class="animate-spin h-6 w-6 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
    </svg>
  </div>
</div>

</div>
