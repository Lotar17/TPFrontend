<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=search"
/>
<div class="search-bar flex flex-col sm:flex-col md:flex-row lg:flex-row gap-4 sm:gap-6 md:gap-12 lg:gap-12 items-center w-full px-4">
  <div class="flex w-full sm:w-full md:w-auto">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Buscar productos..."
      class="p-2 w-full sm:w-full md:w-80 border-l border-t border-b border-gray-300 rounded-l-xl"
    />

    <button
      (click)="onSearch()"
      class="bg-white p-2 text-gray-700 border-r border-t border-b border-gray-300 rounded-r-xl"
    >
      <span class="material-symbols-outlined"> search </span>
    </button>
  </div>

  <!-- Botón para restaurar todos los productos -->
  <button
    (click)="onRestaurar()"
    class="bg-blue-500 text-base text-white p-2 rounded w-full sm:w-full md:w-auto"
  >
    Restaurar
  </button>
</div>

<div *ngIf="productos && productos.length > 0">
  <ul>
    <li *ngFor="let producto of productos">
      {{ producto.descripcion }}
    </li>
  </ul>
</div>
