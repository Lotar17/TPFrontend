<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=search"
/>
<div class="search-bar flex flex-row gap-12">
  <div class="flex">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Buscar productos..."
      class="p-2 w-80 border-l border-t border-b border-gray-300 rounded-l-xl"
    />

    <button
      (click)="onSearch()"
      class="bg-white p-2 text-gray-700 border-r border-t border-b border-gray-300 rounded-r-xl"
    >
      <span class="material-symbols-outlined"> search </span>
    </button>
  </div>

  <!-- Botón para restaurar todos los productos -->
  <button
    (click)="onRestaurar()"
    class="border-2 bg-blanco-no-puro text-base text-black font-medium hover:bg-gaucho-buy-inicio hover:border-white hover:border-2 transition duration-500 hover:text-blanco-no-puro transi p-2 rounded-xl"
  >
    Restaurar
  </button>
</div>

<div *ngIf="productos && productos.length > 0">
  <ul>
    <li *ngFor="let producto of productos">
      {{ producto.descripcion }}
    </li>
  </ul>
</div>
