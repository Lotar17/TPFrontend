<!-- Botón para abrir/cerrar el sidebar -->
<button
  (click)="toggleSidebar()"
  class="fixed top-4 left-4 z-50 p-2 bg-gray-800 text-white rounded-lg shadow-md hover:bg-gray-700 transition duration-300"
>
  <span class="flex items-center space-x-2">
    <svg
      [ngClass]="{ 'rotate-90': sidebarVisible }"
      class="w-5 h-5 transition-transform duration-300"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
    <span *ngIf="!sidebarVisible">Menú</span>
  </span>
</button>

<!-- Sidebar desplegable -->
<div
  *ngIf="sidebarVisible"
  class="fixed top-0 left-0 h-full w-64 bg-gray-900 text-white p-6 shadow-lg z-40 overflow-y-auto transition-all duration-300"
>
  <ul class="flex flex-col space-y-3">
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/publicaprod"
      >
        Cargar Producto
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/compras"
      >
        Ver mis compras
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        (click)="verCarrito()"
      >
        Ver Carrito
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/vendedor"
      >
        Mis Publicaciones
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/devolucionComprador"
      >
        Mis Devoluciones
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/panelSeguimientoCliente"
      >
        Ver seguimientos
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/panelSeguimientoEmpleado"
      >
        Ver Panel empleado
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/micuenta"
      >
        Mi Cuenta
      </a>
    </li>
    <li>
      <a
        class="block bg-indigo-600 hover:bg-indigo-700 transition duration-300 rounded-lg px-4 py-2 text-sm font-medium text-center"
        routerLink="/misventas"
      >
        Mis Ventas
      </a>
    </li>
  </ul>
</div>
