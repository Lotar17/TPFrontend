<!-- Botón para abrir/cerrar el sidebar -->
<button
  (click)="toggleSidebar()"
  class="fixed top-4 left-4 z-50 p-2 bg-gray-800 text-white rounded-lg shadow-md hover:bg-gray-700 transition duration-300"
>
  <span class="flex items-center space-x-2">
    <svg
      [ngClass]="{ 'rotate-90': sidebarVisible }"
      class="w-5 h-5 transition-transform duration-300"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
    <span *ngIf="!sidebarVisible">Menú</span>
  </span>
</button>

<!-- Sidebar desplegable -->
<div
  id="drawer-sidebar"
  [ngClass]="{
    'translate-x-0': sidebarVisible,
    '-translate-x-full': !sidebarVisible
  }"
  class="fixed top-0 left-0 z-40 w-64 h-screen p-4 overflow-y-auto transition-transform transform bg-white dark:bg-gray-800"
  tabindex="-1"
  aria-labelledby="drawer-sidebar-label"
>
  <h5 id="drawer-sidebar-label" class="text-base font-semibold text-gray-500 uppercase dark:text-gray-400">Menú</h5>
  <button
    type="button"
    (click)="toggleSidebar()"
    class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 absolute top-2.5 end-2.5 inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white"
  >
    <svg aria-hidden="true" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
      <path
        fill-rule="evenodd"
        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
        clip-rule="evenodd"
      ></path>
    </svg>
    <span class="sr-only">Cerrar menú</span>
  </button>

  <div class="py-4 overflow-y-auto">
    <ul class="space-y-2 font-medium">
      <li>
        <a routerLink="/publicaprod" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Cargar Producto</span>
        </a>
      </li>
      <li>
        <a routerLink="/compras" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Ver mis compras</span>
        </a>
      </li>
      <li>
        <a (click)="verCarrito()" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group cursor-pointer">
          <span class="ms-3">Ver Carrito</span>
        </a>
      </li>
      <li>
        <a routerLink="/vendedor" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Mis Publicaciones</span>
        </a>
      </li>
      <li>
        <a routerLink="/devolucionComprador" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Mis Devoluciones</span>
        </a>
      </li>
      <li>
        <a routerLink="/panelSeguimientoCliente" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Ver seguimientos</span>
        </a>
      </li>
      <li *ngIf="user && user.rol === 'Empleado'">
        <a routerLink="/panelSeguimientoEmpleado" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Ver Panel empleado</span>
        </a>
      </li>
      <li>
        <a routerLink="/micuenta" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Mi Cuenta</span>
        </a>
      </li>
      <li>
        <a routerLink="/misventas" class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group">
          <span class="ms-3">Mis Ventas</span>
        </a>
      </li>
      <li>
        <a (click)="abrirModalCierreSesion()" class="flex items-center p-2 text-red-700 rounded-lg hover:bg-red-100 dark:text-red-400 dark:hover:bg-red-800 cursor-pointer group">
          <span class="ms-3">Cerrar Sesión</span>
        </a>
      </li>
    </ul>
  </div>
  <!-- Modal de confirmación para cierre de sesión -->
  

</div>
<div *ngIf="cierreSesion" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm">
  <div class="bg-white rounded-lg shadow-md w-full max-w-md p-6">
    <div class="text-center">
      <svg class="mx-auto mb-4 text-gray-400 w-12 h-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M10 11V6m0 8h.01M19 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
      </svg>
      <h3 class="mb-5 text-lg font-medium text-gray-700">¿Estás seguro que querés cerrar sesión?</h3>
      <button (click)="confirmaCierre()" class="text-white bg-red-600 hover:bg-red-800 font-medium rounded-lg text-sm px-5 py-2.5 mr-2">
        Sí, cerrar sesión
      </button>
      <button (click)="cierreSesion = false"
        class="py-2.5 px-5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 hover:text-blue-700">
        Cancelar
      </button>
    </div>
  </div>
</div>
