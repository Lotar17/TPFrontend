<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-green-400 to-blue-500 p-6">
  <div class="w-full max-w-3xl bg-white shadow-lg rounded-2xl p-6">

<div style="background-color: #5e8aa9;">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #208ed8; /* Azul claro para el fondo */
            font-family: sans-serif; /* Fuente genérica para mejor compatibilidad */
        }
    </style>
</head>
</div>

<body class="p-4">
<div *ngIf="producto" class="max-w-md mx-auto bg-white rounded-lg shadow-lg p-8 mt-8 transition duration-300 ease-in-out transform hover:-translate-y-1 hover:shadow-2xl">

 

  <!-- Descripción del Producto -->
  <p class="text-md text-gray-600 mb-5 leading-relaxed border-b pb-3">
    {{ producto.descripcion }}
  </p>

  <!-- Stock disponible -->
  <div class="text-center">
    <p class="font-bold text-2xl text-zinc-900 mb-2">📦 Stock disponible:</p>
    <p class="font-bold text-2xl text-zinc-900 mb-2">{{ producto.stock }}</p>
  </div>

  <!-- Precio -->
  <div class="text-center">
    <p class="text-lg font-semibold text-indigo-700 mb-1">💲 Precio:</p>
    <p class="text-3xl font-bold text-green-500 mb-5">$ {{ precio  }}</p>
  </div>

  <!-- Botones de Acción -->
  <div class="text-center">
    <button (click)="agregarAlCarrito(producto.id)" 
    [disabled]="producto.stock === 0"
      [ngClass]="{ 'opacity-50 cursor-not-allowed': producto.stock === 0 }"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg mb-4 transition-all duration-300 transform hover:scale-105">
      🛒 Agregar al carrito
    </button>

    <nav>
      <a class="text-blue-600 hover:text-blue-700 font-semibold text-lg" [routerLink]="['/comprasincart', producto.id]"
      [routerLink]="(producto.stock ?? 0) > 0 ? ['/comprasincart', producto.id] : null"
      [ngClass]="{ 'opacity-50 pointer-events-none': (producto.stock ?? 0) === 0 }"
      >
        Comprar ahora
      </a>
    </nav>
  </div>
  <div *ngIf="showNotification" class="notification mt-2">
    {{ mensajeNotificacion }}
  </div>

</div>
