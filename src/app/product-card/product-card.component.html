
<div class="max-w-[400px] sm:max-w-[500px] md:max-w-[600px] lg:max-w-[800px] xl:max-w-[1000px] w-full bg-white border border-gray-200 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 hover:scale-[1.02]">
  <a href="#" class="group relative block overflow-hidden">
    <!-- Wishlist Button -->
    <button class="absolute end-4 top-4 z-10 rounded-full bg-white p-1.5 text-gray-900 transition hover:text-gray-900/75">
      <span class="sr-only">Wishlist</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/>
      </svg>
    </button>

    <!-- Product Image -->
    <img [src]="'http://localhost:3000/uploads/' + producto.photoPath" 
      alt="card-image"
      class="w-[calc(100%-16px)] rounded m-2 h-48 object-cover transition duration-500 group-hover:scale-105 sm:h-72 md:h-80 lg:h-96" />
  </a>

  <div class="p-6">
    <div class="mb-2 flex items-center justify-between">
      <!-- Product Name and Price -->
      <h6 class="font-sans antialiased font-bold text-base md:text-lg lg:text-xl text-gray-800">
        {{ producto.descripcion }}
      </h6>
      <h6 class="font-sans antialiased font-bold text-base md:text-lg lg:text-xl text-gray-800">
        {{ precio | currency : "ARS" : "symbol-narrow" : "1.0-2" : "es-AR" }}
      </h6>
    </div>

    <!-- Stock Available -->
    <p class="text-sm text-gray-500 mb-4">
      {{ producto.stock }} unidades disponibles
    </p>
    <p class="text-sm text-gray-500 mb-4">
      Nombre del vendedor: {{ producto.persona?.nombre }} {{ producto.persona?.apellido }}
    </p>

    <nav class="flex flex-col space-y-2">
      <!-- View More Button -->
      <a class="text-indigo-600 bg-indigo-100 hover:bg-indigo-600 hover:text-white transition duration-300 flex items-center justify-center rounded-lg py-2 px-3 text-sm font-medium" [routerLink]="['/productos', producto.id]">
        Ver más
      </a>

      <!-- Add to Cart Button -->
      <button class="text-green-600 bg-green-100 hover:bg-green-600 hover:text-white transition duration-300 flex items-center justify-center rounded-lg py-2 px-3 text-sm font-medium" (click)="agregarAlCarrito(producto)" [disabled]="producto.stock === 0" [ngClass]="{ 'opacity-50 cursor-not-allowed': producto.stock === 0 }">
        Agregar al carrito
      </button>

      <!-- Buy Now Button -->
      <a class="text-blue-600 bg-blue-100 hover:bg-blue-600 hover:text-white transition duration-300 flex items-center justify-center rounded-lg py-2 px-3 text-sm font-medium" [routerLink]="(producto.stock ?? 0) > 0 ? ['/comprasincart', producto.id] : null" [ngClass]="{ 'opacity-50 pointer-events-none': (producto.stock ?? 0) === 0 }">
        Comprar ahora
      </a>
    </nav>

    <!-- Notification -->
    <div *ngIf="showNotification" class="mt-3 text-center text-sm text-gray-600">
      {{ mensajeNotificacion }}
    </div>
  </div>

  <!-- Stock Message (if necessary) -->
  <div *ngIf="mensajeStock" class="bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded relative mt-2 w-fit">
    <span class="block sm:inline">{{ mensajeStock }}</span>
    <button (click)="mensajeStock = null" class="absolute top-0 right-1 text-red-700 hover:text-red-900">✕</button>
  </div>
</div>
