<div
  class="max-w-sm bg-white border w-72 border-gray-200 rounded-lg shadow dark:bg-black-800 dark:border-gray-300"
>
  <div class="rounded-t-lg h-60 w-full" style="background-color: #3e7a9c"></div>

  <div class="p-5">
    <p class="mb-3 font-normal text-zinc-900 line-clamp-3">
      {{ producto.descripcion }}
    </p>
    <p class="font-bold text-2xl text-zinc-900 mb-2">
      {{ precio | currency : "ARS" : "symbol-narrow" : "1.0-2" : "es-AR" }}
      <!-- ISO 4217 -->
    </p>

    <p class="font-light text-gray-500 mb-2">
      {{ producto.stock }} unidades disponibles
    </p>
    
    <nav class="flex flex-col space-y-2">
      <!-- Botón Ver Más -->
      <a
        class="text-zinc-900 hover:bg-zinc-900 hover:text-gray-200 transition duration-300 flex items-center justify-center bg-gray-200 rounded-2xl py-2 px-3"
        [routerLink]="['/productos', producto.id]"
      >
        Ver más
      </a>

      <!-- Botón Agregar al Carrito -->
      <button
      class="text-green-600 bg-green-200 rounded-2xl hover:bg-green-600 hover:text-gray-100 transition duration-300 flex items-center justify-center py-2 px-3"
      (click)="agregarAlCarrito(producto.id)"
      [disabled]="producto.stock === 0"
      [ngClass]="{ 'opacity-50 cursor-not-allowed': producto.stock === 0 }"
    >
      Agregar al carrito
    </button>
  

      <!-- Botón Comprar Ahora -->
      <a
      class="text-blue-600 bg-blue-200 rounded-2xl hover:bg-blue-600 hover:text-gray-100 transition duration-300 flex items-center justify-center py-2 px-3"
      [routerLink]="(producto.stock ?? 0) > 0 ? ['/comprasincart', producto.id] : null"
      [ngClass]="{ 'opacity-50 pointer-events-none': (producto.stock ?? 0) === 0 }"
    >
      Comprar ahora
    </a>
    </nav>

    <!-- Notificación -->
    <div *ngIf="showNotification" class="notification mt-2">
      {{ mensajeNotificacion }}
    </div>
  </div>
</div>
